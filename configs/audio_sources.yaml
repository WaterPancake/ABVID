    vehicle_class: wheeled
    vehicle_model: "Abarth 205 Monza"
    recording_session: "commons_goodwood_festival_of_speed_2009"
    operating_condition: accelerating
    condition_segments:
      - operating_condition: accelerating
        start_seconds: 0.0
        end_seconds: 8.8
        notes: >-
          Human auditory review on 2026-08-24 confirmed clean coming-and-going
          vehicle audio through 8.8 seconds; the quieter trailing ambience is
          excluded. The source description supports the accelerating label.
