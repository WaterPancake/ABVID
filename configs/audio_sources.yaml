# Human-reviewed source catalog for the first vehicle-audio collection.
# The collector resolves provider metadata at download time and refuses licenses
# outside collection_policy.allowed_licenses.
version: 2
collection_policy:
  allowed_licenses:
    - CC0
    - Public domain
    - CC BY 3.0
    - CC BY 4.0
    - CC BY-SA 3.0
    - CC BY-SA 4.0
  provider: wikimedia_commons
  providers:
    - wikimedia_commons
    - internet_archive
    - direct
  review_note: >-
    These licenses permit redistribution of the source audio, subject to the
    listed attribution/share-alike obligations. Verify project redistribution
    terms before releasing a derived corpus.
sources:
