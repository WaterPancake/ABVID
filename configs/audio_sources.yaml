# Human-reviewed source catalog for the first vehicle-audio collection.
# The collector resolves provider metadata at download time and refuses licenses
# outside collection_policy.allowed_licenses.
version: 2
collection_policy:
  allowed_licenses:
    - CC0
    - Public domain
    - CC BY 3.0
    - CC BY 4.0
    - CC BY-SA 3.0
    - CC BY-SA 4.0
  provider: wikimedia_commons
  providers:
    - wikimedia_commons
    - internet_archive
    - direct
  review_note: >-
    These licenses permit redistribution of the source audio, subject to the
    listed attribution/share-alike obligations. Verify project redistribution
    terms before releasing a derived corpus.
sources:
  - id: target-wheeled-abarth-205-goodwood
    kind: target
    provider: wikimedia_commons
    file_title: "File:Abarth 205 Monza (1950).ogg"
    source_page: "https://commons.wikimedia.org/wiki/File:Abarth_205_Monza_(1950).ogg"
    vehicle_class: wheeled
    vehicle_model: "Abarth 205 Monza"
    recording_session: "commons_goodwood_festival_of_speed_2009"
    operating_condition: accelerating
    condition_segments:
      - operating_condition: accelerating
        start_seconds: 0.0
        end_seconds: 8.8
        notes: >-
          Reviewed source-audio spectrogram: vehicle pull-away is active through
          8.8 seconds; the quieter trailing ambience is excluded.
    expected_license: "CC BY-SA 3.0"
    output_path: "targets/wheeled/commons_goodwood_festival_of_speed_2009/abarth_205_monza.wav"
    attribution: "Edvvc, Abarth 205 Monza (1950), Wikimedia Commons, CC BY-SA 3.0"
    notes: "15-second recording of a restored 1.1 L four-cylinder car pulling away."
    status: approved

