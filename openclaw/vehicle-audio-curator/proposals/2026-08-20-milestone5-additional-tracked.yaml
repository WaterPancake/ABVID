# ================= REJECTED / NOT ADOPTED =================

rejected:
  - source_id: candidate-tracked-merkava-III-showoff
    reason: >-
      Predominantly gunfire and smoke-grenade bursts; not isolated engine/movement audio.
      Content unsuitable for a clean target-class recording.
  - source_id: candidate-tracked-hungarian-kf41-lynx-dvids
    reason: >-
      DVIDS compilation/montage ("various shots ... in action") likely carrying narration;
      not a single coherent recording session.
  - source_id: candidate-tracked-inside-ccvl-1
    reason: >-
      YouTube-derived interior footage with talking; not isolated vehicle movement;
      provenance unclear. Rejected.
  - source_id: candidate-tracked-zorawar-light-tank
    reason: >-
      GODL-India license is NOT in the catalog allowlist (CC0 / PD / CC BY / CC BY-SA
      only); field-firing content (gunfire) and not-yet-reviewed license status. Rejected.
  - source_id: candidate-tracked-m1-2nd-tanks-camp-lejeune
    reason: >-
      DVIDS field-exercise B-roll, 1080p but an integrated multi-scenario exercise clip
      with firing/maneuver montage; not a single identical tracked session; favor cleaner
      candidates.
  - source_id: candidate-tracked-m1-staying-on-track
    reason: >-
      KMEP 17-6 multi-vehicle bilateral training montage (M1 / K1 / AAV / mine-clearing
      line charge) with likely narration; not a single tracked recording session; 508 MB
      documentary-style content.
  - source_id: candidate-tracked-m1-other-live-fire
    reason: >-
      All remaining M1 Abrams category videos are live-fire / target-practice / firing
      dominated (Jet Turbines, Live-Fire HotEx, Loader, Mosul over-watch, NTC night
      firing), unsuitable as clean isolated movement/idle/start audio.
  - source_id: candidate-tracked-saumur-panther-2012
    reason_note: >-
      Potentially valid (Panzer V movement at Saumur, CC BY-SA 3.0) but listed as
      not-adopted here because its exact direct URL could not be re-verified during this
      pass and it shares a demo date/venue group with the Saumur Renault FT 2012-07-25
      (same-session risk). Re-check if a cleaner isolated single-vehicle take is needed.
  - source_id: candidate-tracked-lippujuhlan-2016-parade
    reason_note: >-
      Finnish 2016 Turku parade with Leopard 2A4 / 2S1 (CC BY-SA 4.0, MKFI) is a valid
      independent event but is a multi-vehicle parade with likely music/PA; weaker than
      the three adopted candidates. Held as a lower-priority fallback.

