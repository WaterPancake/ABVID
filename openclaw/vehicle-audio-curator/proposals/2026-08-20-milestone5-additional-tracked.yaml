# Milestone 5 — Additional Independent Tracked-Vehicle Sessions (proposal-only)
# Purpose: The balanced acquisition refresh (2026-08-20) established that the catalog
# reaches only FOUR independent tracked sessions because the two MPF entries are the
# same recording session (duplicate footage posted to Twitter and YouTube). To reach
# the >=5 independent tracked-session gate with a fallback, locate at least TWO
# genuinely independent, real (non-synthetic) tracked-vehicle recording sessions.
#
# Status legend (per source-curator skill): discovery entries are `review_required`
# until the operator has verified chain of custody / listened to the audio. No entry
# here is `approved`; approval must follow an explicit operator decision.
#
# Constraint: no downloads, no collector invocation, no catalog/code/label edits.

purpose: >-
  Close the Milestone 5 tracked-session shortfall by discovering at least two genuinely
  independent, real tracked-vehicle recording sessions with allowlisted redistribution
  rights, so one can serve as the fifth tracked session and another as a fallback.
  Searched authoritative Wikimedia Commons file pages and DVIDS-derived Commons mirrors
  only. No audio was downloaded; the collector was not invoked.
assessment_date: "2026-08-20"
method: >-
  Enumerated Wikimedia Commons 'Videos of tanks' and 'Videos of M1 Abrams tanks'
  categories plus individual authoritative file pages. For each candidate, verified
  creator, title, date, resolution/format, license + license URL, source URL, direct
  upload.wikimedia.org URL, and recording-session identity. Cross-checked against
  configs/audio_sources.yaml and all curator proposals to exclude duplicates and
  session leaks. Reported date is 2026-08-20.

local_corpus_baseline:
  collected_tracked_sessions: 1
  collected_tracked_detail:
    - dvids_romanian_tank_range_2014   # local corpus, via TR-85M1 (approved, collected)
  cataloged_tracked_sessions_prior_to_this_proposal: 4
  cataloged_tracked_detail:
    - dvids_romanian_tank_range_2014                                # collected (local)
    - us_army_armor_cavalry_collection_tankodrome_2023             # approved (MPF, both files = same session)
    - commons_lappeenranta_flag_day_reenactment_2014               # approved (StuG III G)
    - commons_tiger131_engine_start_2017                           # review_required (chain of custody)
  leakage_note: >-
    mpf-firepower and bae-mpf-arrival are the SAME Tankodrome 2023 recording session
    (identical Armor & Cavalry Collection footage on two platforms) and count as ONE
    session. This is why the prior catalog reached only 4 independent tracked sessions
    from 5 source records.

session_gate_assessment:
  requirement: ">=5 independent tracked sessions/class for the first-transfer corpus"
  after_operator_review_of_this_proposal: reachable
  scenario_A_tiger131_cleared: >-
    local(1) + tankodrome(1) + lappeenranta(1) + tiger131(1) = 4; adding ONE of this
    proposal's candidates (e.g. retromobile_amx30) closes the gate at 5.
  scenario_B_tiger131_blocked: >-
    local(1) + tankodrome(1) + lappeenranta(1) = 3; adding TWO of this proposal's
    candidates (e.g. retromobile_amx30 + one fallback) closes the gate at 5, with the
    third candidate available as an extra fallback.
  verdict: >-
    The five-session tracked gate becomes REACHABLE once the operator approves at
    least two of the three new candidates (or one new candidate plus tiger131
    clearance). It is NOT independently satisfied by catalog fields alone; operator
    review of chain of custody and audio content is required.

