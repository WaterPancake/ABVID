  adopted_candidates:
    - candidate-target-tracked-retromobile-amx30-2015   # primary (fifth-session)
    - candidate-target-tracked-bovington-type59-2014    # fallback A
    - candidate-target-tracked-t18-khabarovsk-2015      # fallback B
  session_gate_reachable_after_review: true
  session_gate_conditions: >-
    Operator must approve at least two of the three new candidates (scenario B) or one
    new candidate plus tiger131 clearance (scenario A), after listening review confirms
    tracked-engine-dominant audio and any disputed label (Type 59) is resolved.
  notes:
    - >-
      All adopted candidates are `review_required` per the skill. None is auto-approved.
    - >-
      No downloads were performed and the collector was not invoked.
    - >-
      No catalog, code, label, or other file was modified; this proposal is the only
      new artifact.
