# ---------------------------------------------------------------------------
# Recommendations summary
# ---------------------------------------------------------------------------
recommendations:
  approve: [target-tracked-mpf-firepower, target-tracked-stug-iiig-lappeenranta, target-tracked-bae-mpf-arrival, target-wheeled-vanwall-1957-goodwood-2010, target-wheeled-maserati-granturismo-exhaust, target-wheeled-car-cobblestone-pass, target-wheeled-cars-night-stopping]
  review_required: [target-tracked-tiger131-engine-start]
  reject: []

blockers:
  - id: tracked-session-gate
    severity: blocking
    detail: >-
      The ≥5 independent sessions per class transfer gate is not reachable for the
      tracked class from the current catalog. Local corpus contributes 1 tracked session;
      the four prioritized tracked sources add only 3 independent sessions (mpf-firepower
      and bae-mpf-arrival are the same 2023-01-25 Tankodrome BAE MPF arrival event and
      must be grouped). Total tracked = 4. At least one additional independent tracked
      target recording must be discovered/cataloged, or the rights-ambiguous Internet
      Archive 78rpm tank item must receive explicit legal clearance, before the tracked
      gate (>=5) can be claimed. No fabrication of a fifth tracked session is acceptable.
  - id: tiger131-provenance
    severity: review_required
    detail: >-
      CC0 license is clear, but the file lists 'Unknown author' and a YouTube origin.
      Operator must confirm the recording chain of custody and that no third-party rights
      beyond the CC0 dedication block reuse before treating it as an approved transfer source.
  - id: vanwall-429
    severity: retry
    detail: >-
      Vanwall (1957).ogg previously failed with HTTP 429 (2026-08-19). Wikimedia rate
      limiting requires a later retry; do not bypass the provider's access controls.
  - id: content-review-gate
    severity: process
    detail: >-
      corpus_audit.json fails closed until reviewed vehicle-audio segment boundaries are
      set. maserati and cars-night are mixed-condition sources that require audiovisual
      segment review; every proposed target needs review before the audit gate can pass.

