# Milestone 5 balanced acquisition refresh — proposal-only review
# Date: 2026-08-20
# Reviewer: Vehicle Audio Curator (proposal; no downloads, no collector runs)
#
# Scope: verify current authoritative provider metadata and reuse rights for the
# eight already-cataloged target sessions listed in the request, and identify the
# smallest balanced first-transfer batch reaching at least five independent
# sessions per class when combined with the locally collected real corpus.
#
# All eight sources below were present in configs/audio_sources.yaml when reviewed.
# Seven remained approved; Tiger 131 was returned to review_required because its
# unknown-author YouTube provenance needs an explicit operator decision.
# No audio was downloaded and no catalog or code was modified.

purpose: "Milestone 5 (real-world transfer) readiness: establish a balanced, session-independent first-transfer real corpus."
assessment_date: 2026-08-20
proposal_type: acquisition_refresh
download_gate: "No downloads performed. An explicit operator message (e.g. 'approve download: <source-id>') is required before the collector runs."

# ---------------------------------------------------------------------------
# Current local real corpus (already collected; from data/real_eval_v1/corpus_audit.json)
# ---------------------------------------------------------------------------
local_corpus_baseline:
  tracked_sessions:
    - dvids_romanian_tank_range_2014        # collected via target-tracked-tr85m1-tank-range
  wheeled_sessions:
    - commons_goodwood_festival_of_speed_2009   # collected via target-wheeled-abarth-205-goodwood
    - commons_soundsofchanges_private_collection # collected via target-wheeled-ford-model-t-start
  audit_gate:
    requires_min_sessions_per_class: 3
    current_tracked_sessions: 1
    current_wheeled_sessions: 2
    blocking_reasons:
      - "fewer than three independent recording sessions per class required (tracked=1, wheeled=2)"
      - "reviewed vehicle-audio segment boundaries not set (all collected target sessions unreviewed)"

# ---------------------------------------------------------------------------
# Balanced batch analysis (independent recording sessions only)
# ---------------------------------------------------------------------------
batch_analysis:
  summary: >-
    The four prioritized wheeled sources add four independent sessions, bringing
    wheeled to six. The four prioritized tracked sources add only three independent
    sessions because target-tracked-mpf-firepower and target-tracked-bae-mpf-arrival
    are two platform copies of the same 2023-01-25 Tankodrome arrival event and must
    be treated as one recording session under the dataset leakage rules. Combined with
    the already-collected terminal tracked session, tracked reaches four independent
    sessions only. Five independent tracked sessions are NOT reachable from the current
    catalog; the tracked side is the binding blocker for the ≥5/class gate.

  wheeled_session_projection:
    description: "Local (2) + prioritized (4) = 6 independent sessions. >=5 achieved."
    sessions:
      - commons_goodwood_festival_of_speed_2009       # local, collected
      - commons_soundsofchanges_private_collection     # local, collected
      - commons_goodwood_festival_of_speed_2010        # target-wheeled-vanwall-1957-goodwood-2010
      - freesound_lmartins_maserati_granturismo_2019   # target-wheeled-maserati-granturismo-exhaust
      - pdsounds_mastermesh_car_cobblestone_2008       # target-wheeled-car-cobblestone-pass
      - commons_cologne_night_traffic_light_2024       # target-wheeled-cars-night-stopping
    independent_confirmed: true

  tracked_session_projection:
    description: "Local (1) + prioritized-distinct (3) = 4 independent sessions. Short of 5."
    sessions:
      - dvids_romanian_tank_range_2014                     # local, collected
      - us_army_armor_cavalry_collection_tankodrome_2023   # mpf-firepower AND bae-mpf (same event -> one session)
      - commons_lappeenranta_flag_day_reenactment_2014     # stug-iiig
      - commons_tiger131_engine_start_2017                 # tiger131
    independent_confirmed: true
    collision_note: >-
      mpf-firepower (Twitter upload) and bae-mpf-arrival (YouTube upload) carry the
      same U.S. Army Armor & Cavalry Collection description of the same 2023-01-25
      BAE MPF testbed arrival at the Tankodrome, both dated 2023-01-25. They are the
      same recording event / source footage on two platforms and MUST be grouped as
      one recording_session. Counting them as two sessions would be a session leak.

  verdict: BLOCKED_ON_TRACKED
  blocker: >-
    At least five independent sessions per class is required for the transfer split.
    The wheeled side reaches six, but the tracked side reaches only four from the
    current catalog. No fifth independent tracked session exists in
    configs/audio_sources.yaml. Reaching the five-session tracked gate requires at
    least one additional independent tracked target recording (not currently cataloged)
    OR explicit legal clearance to re-enable the rights-ambiguous Internet Archive 78rpm
    tank item (internet_archive_78rpm_gbia0410053a) as an independent session. Do not
    fabricate a fifth tracked session.
  smallest_balanced_batch: >-
    Recommended first transfer batch = the eight prioritized sources below (4 wheeled
    + 4 tracked sources). This yields 6 wheeled / 4 tracked independent sessions when
    combined with the local corpus (for tracked, mpf+bae count as one session). It is
    the smallest batch that delivers a balanced six/four split; it does NOT satisfy the
    >=5 tracked requirement and therefore the protocol should not be claimed as
    session-gate complete until a fifth tracked session is secured.

