# Wheeled-replacement acquisition proposal — 2026-08-23 (proposal-only)
#
# Purpose:
#   1. Provide a legitimate alternative media URL for the cataloged DVIDS Southern
#      Strike Humvee source (candidate-target-wheeled-humvee-southern-strike-2022)
#      whose direct endpoint (https://www.dvidshub.net/download/videofile/8309579)
#      failed once with HTTP 403 on 2026-08-23 and must NOT be retried or bypassed.
#   2. Identify at least one NEW independent, real-world, ground-wheeled vehicle
#      recording suitable for a fresh held-out tracked-vs-wheeled evaluation session.
#
# Constraints honored (per operator instruction and AGENTS.md):
#   - Read-only research: no downloads, no collector invocation, no catalog/code/label edits.
#   - Authoritative sources only: Wikimedia Commons file-page/API metadata, official
#     DVIDS pages, and Internet Archive item search/metadata. No scraped YouTube, no
#     CDN/player scraping as a workaround, no NC terms, no Mars/synthetic sources,
#     no duplicates of cataloged or already-proposed items, no same-session footage.
#   - Every candidate below is status: review_required. Nothing is approved.
#
# Status legend: all entries are review_required (operator decision required before
# any download gate). `decision: accepted` = recommended lead; `decision: rejected`
# = investigated and rejected with the reason recorded.

purpose: >-
  Replace the blocked DVIDS wheeled acquisition path with (a) an officially listed
  alternative media URL for the same Southern Strike Humvee source and (b) fresh,
  independently verifiable wheeled-vehicle target recordings for the Milestone 5/6
  held-out evaluation session.
assessment_date: "2026-08-23"
method: >-
  Re-verified the authoritative DVIDS video page and the official DVIDS download-popup
  metadata for video 842870; enumerated Wikimedia Commons audio candidates via the
  Commons search API and verified each file's creator, date, license short name,
  duration, and stable upload.wikimedia.org URL via the Commons imageinfo API
  (iiprop=url|extmetadata|size); queried Internet Archive advancedsearch for
  vehicle-dominant field recordings with allowlisted licenses. Cross-checked all
  leads against configs/audio_sources.yaml, data/collection_manifest.jsonl, and all
  13 existing curator proposals to exclude duplicates and same-session footage.

