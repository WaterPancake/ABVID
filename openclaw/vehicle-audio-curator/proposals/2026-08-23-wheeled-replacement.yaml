rejected:
  - source_id: rejected-bus-drive-ambience-with-talk
    status: review_required
    decision: rejected
    title: "File:Bus drive ambience with talk.ogg"
    provider: wikimedia_commons
    license: "Public domain (PDSounds 408, qubodup)"
    reason: >-
      Interior bus ambience with occupant conversation (title itself states 'with
      talk'); foreground speech disqualifies it as vehicle-dominant target audio.
  - source_id: rejected-moped-driving-by
    status: review_required
    decision: rejected
    title: "File:Moped driving by.ogg"
    provider: wikimedia_commons
    license: "Public domain (PDSounds 97, stephan, 2007-04-17)"
    reason: >-
      Two-wheeled moped pass-by, 19 s, heavy stereo panning; not representative of the
      wheeled-automobile class used across the catalog and too short for a stable
      held-out session. Distinct session from the adopted car lead, but class
      representativeness fails.
  - source_id: rejected-sunday-city-street-noise-1-3
    status: review_required
    decision: rejected
    title: "File:Sunday in the city street noise1/2/3.ogg"
    provider: wikimedia_commons
    license: "Public domain (PDSounds 530-532, cori)"
    reason: >-
      Street-traffic ambience, not an isolated single-vehicle target take; background-
      like content overlapping the existing road-traffic background category.
  - source_id: rejected-frogs-birds-tractor-holysloot
    status: review_required
    decision: rejected
    title: "File:Frogs, birds, tractor in a field next to Holysloot - SoundCloud - lottebelice.ogg"
    provider: wikimedia_commons
    license: "Not established in search snippet; SoundCloud import"
    reason: >-
      Frogs and birds are the foreground content; tractor is incidental. SoundCloud-
      import chain and no verified allowlisted license in the snippet.
  - source_id: rejected-geiser-cotorra-tractor
    status: review_required
    decision: rejected
    title: "File:Sonido geiser riachuelo cotorra tractor marcha atrás.ogg"
    provider: wikimedia_commons
    reason: >-
      Geyser water, parrots, and an incidentally audible reversing tractor; not
      vehicle-dominant motion audio.
  - source_id: rejected-air-tractor-sledge-spoken
    status: review_required
    decision: rejected
    title: "File:En-Air-tractor sledge.ogg"
    provider: wikimedia_commons
    reason: >-
      Spoken Wikipedia article (spoken word), not vehicle audio.
  - source_id: rejected-morgan-3-wheeler-goodwood-2011
    status: review_required
    decision: rejected
    title: "File:Morgan 3 Wheeler.ogg"
    provider: wikimedia_commons
    license: "CC BY-SA 3.0"
    reason: >-
      License and session are technically valid (Edvvc own work, Goodwood Festival of
      Speed 2011-07-03 hillclimb, 19.8 s), but it is a fifth Goodwood/Edvvc-family
      wheeled take after the four cataloged Goodwood sessions (2009 x3, 2010 x1) and
      adds almost no venue/session diversity for a held-out evaluation. Keep only as a
      last-resort fallback.
  - source_id: rejected-internet-archive-sweep
    status: review_required
    decision: rejected
    title: "Internet Archive audio search: 'car driving', 'tractor', 'engine start', 'car pass'"
    provider: internet_archive
    reason: >-
      Advanced-search sweeps returned only podcasts/interviews, films (e.g.
      Red_Library_Cars_2), and game/simulator rips; the licenseurl-filtered query
      (CC0 or CC BY) for tractor/engine-start/car-pass returned zero hits. No
      vehicle-dominant field recording with an explicit allowlisted license was found
      on Internet Archive in this pass.
  - source_id: rejected-dvids-humvee-capabilities-and-s2as
    status: review_required
    decision: rejected
    title: "DVIDS Humvee Capabilities (35282) and S2AS B-Roll (973361)"
    provider: direct
    reason: >-
      Already proposed on 2026-08-21 (proposals/2026-08-21-dvids-humvee-capabilities.yaml
      and 2026-08-21-dvids-s2as-wheeled-passbys.yaml); both carry the same unresolved
      /download/videofile/ 403 access-path issue. Not new candidates.
  - source_id: rejected-perseverance-rover
    status: review_required
    decision: rejected
    title: "Sounds of Perseverance Mars rover driving (already cataloged)"
    provider: wikimedia_commons
    reason: >-
      Mars platform, excluded from fresh work by the operator instruction; already
      cataloged as target-wheeled-perseverance-rover-sol-16.
  - source_id: rejected-wws-ursus-c342-engine-and-c328-takes
    status: review_required
    decision: rejected
    title: "WWS TractorUrsusC342engine.ogg; WWS TractorUrsusC328driving/engine.ogg"
    provider: wikimedia_commons
    license: "CC BY 4.0"
    reason: >-
      Same Work With Sounds museum collection and session-day family as the adopted
      Ursus C 342 driving take (Szreniawa 2015-06-26); adding them would create
      same-session leakage under the project's recording-session rules.

