remaining_gaps:
  - >-
    No new clean, standalone BMP-2 recording with authoritative provenance was found.
    Search results were either the previously rejected T-80U/BMP-2 source or mixed,
    firing-heavy exercises, so BMP-2 remains open.
  - >-
    The T-72/BMP-3 road march and T-80BVM/MT-LBVMK driving session are mixed-identity
    sources. Standalone second sessions are still desirable for vehicle-held-out tests.
  - >-
    Idle, acceleration, and deceleration coverage cannot be counted until the operator
    reviews and timestamps those states in the downloaded recordings.

