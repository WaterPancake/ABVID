  - lead: "HMMWV egress or convoy simulators"
    reason: "Trainer/simulator audio is not a real HMMWV engine recording."
  - lead: "Strykers and BWP-1s"
    reason: "Only 35 seconds and mixes wheeled Strykers with tracked BWP-1s."
