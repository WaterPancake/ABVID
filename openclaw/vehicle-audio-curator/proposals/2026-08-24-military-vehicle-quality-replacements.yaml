# Military vehicle quality replacements — 2026-08-24 (proposal only)
#
# No media was downloaded for any source below. Each candidate remains
# review_required until the operator approves its exact source ID and then
# performs audiovisual review and trimming.

purpose: >-
  Replace military-vehicle candidates rejected by the operator for insufficient
  vehicle audio or poor quality, with emphasis on Bradley, T-72, T-80, BMP,
  BTR-80, and HMMWV sessions. Prefer driving or road-march material over firing
  exercises and preserve one recording_session for every trim from one source.
assessment_date: "2026-08-24"
status: review_required
method: >-
  Searched official DVIDS records and Wikimedia Commons file pages, checked the
  stated vehicle identity, source session, creator, duration, media endpoint, and
  reuse terms, and rejected obvious simulator, speech-package, firing-dominant,
  dubious-reupload, or unidentified mixed-vehicle leads. Direct media URLs were
  checked with metadata-only HTTP requests; their media bodies were not downloaded.

download_gate: >-
  Do not download any candidate until the operator sends the exact message
  `approve download: <source-id>`. Use scripts/collect_audio.py after approval;
  do not hand-download media or bypass a blocked provider endpoint.

dataset_rules:
  - All trims from one candidate retain its recording_session below.
  - A source may be assigned to a specific vehicle only for an interval where the vehicle identity is visually defensible.
  - Speech, music, weapons, radios, other vehicles, wind, and edit boundaries must be reviewed before admission.
  - Operating states listed as review targets are hypotheses, not labels, until the operator confirms them.
  - Every candidate is a real-world recording; no procedural or generated audio is proposed.

license_families:
  dvids_public_domain:
    license: "Public domain statement on the item page; DVIDS reuse restrictions apply"
    license_url: "https://www.dvidshub.net/about/copyright"
    obligations: >-
      Retain title, creator, unit, DVIDS ID/VIRIN, and provenance; do not imply
      DoD endorsement; respect privacy/publicity, trademark, and military-mark limits.
  milru_cc_by_4:
    license: "CC BY 4.0"
    license_url: "https://creativecommons.org/licenses/by/4.0/"
    obligations: "Credit Mil.ru, link the license, and identify modifications."

review_order:
  - candidate-target-tracked-t80bvm-driving-readiness-2021
  - candidate-target-tracked-bmp1-trident-juncture-moveout-2018
  - candidate-target-tracked-t72-bmp3-102nd-march-2022
  - candidate-target-tracked-bradley-nato-muddy-maneuver-2025
