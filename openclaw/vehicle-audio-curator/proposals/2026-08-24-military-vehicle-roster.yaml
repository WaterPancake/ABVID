reserve_or_rejected_leads:
  - source_id: reserve-target-tracked-abrams-arrive-poland-2017
    decision: reserve
    reason: >-
      Public-domain DVIDS video 504801 (1:44) may contain useful low-speed/idling M1
      Abrams audio, but railhead, train, truck, handling, and speech contamination
      are likely. Review only if the two Abrams candidates above fail.
    source_page: "https://www.dvidshub.net/video/504801/oar-poland-m1-abrams-arrive-poland-broll"
  - source_id: reserve-target-tracked-bradley-c5-load-2023
    decision: reserve
    reason: >-
      Public-domain DVIDS video 907324 (3:08) shows slow Bradley loading, but C-5/APU,
      ramp machinery, crew, and speech are likely to dominate.
    source_page: "https://www.dvidshub.net/video/907324/army-and-air-force-load-bradley-fighting-vehicle-c-5-galaxy-b-roll"
  - source_id: reserve-target-wheeled-jltv-fort-mccoy-2021
    decision: reserve
    reason: >-
      Public-domain DVIDS video 800301 is an independent JLTV session but only 28
      seconds; review if longer 2019/2020 sessions fail.
    source_page: "https://www.dvidshub.net/video/800301/joint-light-tactical-vehicle-driver-training-fort-mccoy"
  - source_id: rejected-target-tracked-t72b-sergeyevsky-2020
    decision: rejected_for_initial_batch
    reason: >-
      CC BY 4.0 Commons source explicitly documents live firing; engine-only trims
      might exist, but weapons contamination makes it inferior to the 2019 T-72B.
    source_page: "https://commons.wikimedia.org/wiki/File:T-72B_%26_T-72B_mod._1989_at_the_Sergeyevsky_Training_Ground_(08-04-2020).webm"
  - source_id: rejected-target-wheeled-btr80-btr82a-dagestan-2020
    decision: rejected_for_initial_batch
    reason: >-
      CC BY 4.0 exercise montage mixes BTR-80 and BTR-82A and is likely firing-heavy;
      the two standalone BTR-82AM driving candidates are stronger.
    source_page: "https://commons.wikimedia.org/wiki/File:177th_Naval_Infantry_Regiment%27s_exercise_at_mountain_area_(26-03-2020).webm"

