# Military tracked/wheeled acquisition proposal — 2026-08-24 (proposal only)
#
# No media was downloaded. Every candidate is review_required until the operator
# approves an exact source ID and then listens to, labels, and trims the recording.

purpose: >-
  Build a rights-auditable review pool of real-world recordings for common NATO and
  Soviet/Russian tracked and wheeled military vehicles. The requested roster is M1
  Abrams, M2/M2A3 Bradley, T-72, T-80, T-90, BMP-1/2/3, BTR-series, HMMWV/Humvee,
  and JLTV. These sources are intended for passive acoustic tracked-vs-wheeled
  research; none is admitted to the corpus by this proposal.
assessment_date: "2026-08-24"
status: review_required
method: >-
  Searched official DVIDS/DoD records and Wikimedia Commons file pages, checked
  vehicle identity, creator, source date, stable session identifiers, duration,
  media format, and reuse terms, and grouped mirrors or multiple trims from one
  original recording as one recording_session. DVIDS raw-CDN URLs were checked as
  reachable MP4 resources without downloading their media bodies. Wikimedia file
  pages provide the original media URLs and codec/duration metadata. Audiovisual
  cleanliness remains unverified until manual review.

download_gate: >-
  Do not download any candidate from this proposal until the operator sends the
  exact message `approve download: <source-id>`. Approval is source-specific. Use
  the repository collector after approval; do not hand-download or bypass a blocked
  provider endpoint.

dataset_rules:
  - Every trim from one source keeps the recording_session shown below.
  - Mirrors with the same DVIDS video ID, VIRIN, or Commons original are duplicates.
  - Mixed-vehicle footage may be retained only when the visible vehicle identity is
    defensible for the entire audio interval; all such trims remain one session.
  - Speech, music, weapons fire, radios, wind, and other vehicles must be noted or
    excluded during manual segmentation.
  - All sources below contain real recorded footage; no procedural or generated
    vehicle audio is proposed.

license_families:
  dvids_public_domain:
    license: "Public domain statement on the item page; DVIDS reuse restrictions apply"
    license_url: "https://www.dvidshub.net/about/copyright"
    obligations: >-
      Retain title, creator, unit, DVIDS ID/VIRIN, and provenance; do not imply DoD
      endorsement; respect privacy/publicity, trademark, and military-mark limits.
  milru_cc_by_4:
    license: "CC BY 4.0"
    license_url: "https://creativecommons.org/licenses/by/4.0/"
    obligations: "Credit Mil.ru, link the license, and identify modifications."
  kuzmin_cc_by_sa_4:
    license: "CC BY-SA 4.0"
    license_url: "https://creativecommons.org/licenses/by-sa/4.0/"
    obligations: >-
      Credit Vitaly V. Kuzmin, link the license, identify modifications, and apply
      the same or a compatible license to adaptations.

