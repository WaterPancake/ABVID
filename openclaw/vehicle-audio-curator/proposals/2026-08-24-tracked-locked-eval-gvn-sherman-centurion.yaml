shared_provenance_note: >-
  Both accepted candidates belong to the same archival series (Geluid van
  Nederland, a formal partnership of the Netherlands Institute for Sound and
  Vision, De Auditieve Dienst, and Kennisland; 2000 NISV-donated field
  recordings). They are distinct archival recordings: different SoundCloud track
  identifiers, different vehicles (M4 Sherman vs Centurion), and different
  surfaces (concrete vs sand track). Each is assigned an independent
  recording_session keyed to its archival track ID. Collector should confirm the
  original recording dates via the NISV catalog before admitting both to a
  train/test split.

