[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vehicle-audio"
version = "0.1.0"
description = "Reproducible synthetic vehicle-acoustic dataset generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "PyYAML>=6.0",
  "scipy>=1.11",
  "soundfile>=0.12",
  "torch>=2.2",
  "torchaudio>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
inspection = ["matplotlib>=3.8"]

[project.scripts]
vehicle-audio = "vehicle_audio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_audio"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

